<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barber Elite - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }
    .logo span { color: #d4a853; }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      border: 2px solid #d4a853;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }
    p {
      color: #a0a0a0;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .retry-btn {
      background: #d4a853;
      color: #0a0a0a;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .retry-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">&#9888;</div>
    <div class="logo"><span>&#9996;</span> Barber <span>Elite</span></div>
    <h1>Voc&#234; est&#225; offline</h1>
    <p>Conecte-se &#224; internet para continuar</p>
    <button class="retry-btn" onclick="window.location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
